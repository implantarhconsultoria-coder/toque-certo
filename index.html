<!doctype html>
<html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Toque Certo · Suporte</title>
<style>
:root{color-scheme:dark;font:17px/1.6 system-ui,sans-serif;background:#0a0612;color:#f6f3ff}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:1.4rem;box-sizing:border-box;background:radial-gradient(ellipse at top,#261247,#0a0612 60%)}
main{max-width:33rem;width:100%;box-sizing:border-box;padding:clamp(1.5rem,5vw,3rem);border:1px solid #503b6d;border-radius:1.5rem;background:#130d22}
h1{font-size:clamp(2.15rem,7vw,3.5rem);line-height:1;margin:.25rem 0 1.25rem} h1 span,a{color:#54e6ff}
p{margin:.75rem 0 1.1rem}.button{display:inline-block;border-radius:.75rem;padding:.65rem 1rem;background:#54e6ff;color:#130d22;font-weight:750;text-decoration:none}
footer{display:flex;flex-wrap:wrap;gap:1rem;margin-top:1.5rem;padding-top:1rem;border-top:1px solid #503b6d;font-size:.9rem}
[hidden]{display:none!important}
</style>
<main><h1>TOQUE <span>CERTO</span></h1>
<p id="message">Jogo de reflexos em partidas de 30 segundos. Para falar com o suporte, envie um e-mail com seu dispositivo e o que aconteceu.</p>
<a id="open" class="button" hidden>Abrir desafio no app</a>
<footer><a href="mailto:implantarh.consultoria@gmail.com">Falar com o suporte</a><a href="./privacidade.html">Política de privacidade</a></footer></main>
<script>
const params = new URLSearchParams(location.search);
const score = params.get('desafio');
if (score && /^\d{1,4}$/.test(score)) {
  const from = params.get('de')?.slice(0, 24);
  document.title = 'Desafio · Toque Certo';
  document.querySelector('#message').textContent = (from || 'Seu amigo') + ' fez ' + Number(score) + ' pontos. Abra o Toque Certo instalado no celular e tente superar essa marca.';
  const challenge = new URLSearchParams({ desafio: score });
  if (from) challenge.set('de', from);
  const open = document.querySelector('#open');
  open.href = 'toquecerto://desafio?' + challenge;
  open.hidden = false;
}
</script></html>
