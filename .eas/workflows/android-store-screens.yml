name: Android store screenshots
on:
  workflow_dispatch: {}
jobs:
  build_qa:
    type: build
    params:
      platform: android
      profile: store-qa
  capture_screens:
    type: maestro
    needs: [build_qa]
    runs_on: linux-medium-nested-virtualization
    params:
      build_id: '${{ needs.build_qa.outputs.build_id }}'
      flow_path: .maestro/store-screens.yml
      device_identifier: pixel_6
    hooks:
      after_maestro_tests:
        - uses: eas/upload_artifact
          with:
            type: other
            name: store-screens
            path: '**/store-*.png'
